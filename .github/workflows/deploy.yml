name: Deploy Story Garden to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - '.nojekyll'
      - 'app.js'
      - 'assets/**'
      - 'books.js'
      - 'icon.svg'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'styles.css'
      - 'vendor/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare the static site
        run: |
          mkdir -p public/assets public/vendor
          cp index.html styles.css app.js books.js manifest.webmanifest service-worker.js icon.svg .nojekyll public/
          cp assets/*.webp public/assets/
          cp vendor/* public/vendor/
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
